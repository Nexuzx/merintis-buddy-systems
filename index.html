<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merintis — Onboarding Buddy System</title>
  <meta name="description" content="Platform onboarding buddy system Merintis. Bantu karyawan baru beradaptasi dengan cepat bersama rekan berpengalaman." />

  <!-- Google Fonts: Plus Jakarta Sans (brand/heading) + Inter (body/UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Lucide Icons via CDN — ringan, konsisten, accessible -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Skip navigation untuk pengguna keyboard -->
  <a href="#app-content" class="skip-link">Langsung ke konten utama</a>

  <!-- Overlay mobile sidebar (di luar aside agar z-index tepat) -->
  <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

  <!-- ══════════════════════════════════════
       SIDEBAR  (aside = navigation landmark)
  ══════════════════════════════════════ -->
  <aside class="sidebar" id="sidebar"
    aria-label="Menu navigasi Merintis"
    aria-hidden="false">

    <!-- Logo & Brand -->
    <div class="sidebar-header">
      <a href="#/beranda" class="brand-link" aria-label="Merintis — Kembali ke beranda">
        <!-- SVG: tunas tumbuh dari tanah = simbol "merintis" -->
        <svg class="brand-logo" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
          <circle cx="20" cy="20" r="20" fill="var(--clr-primary)"/>
          <path d="M20 30 L20 18" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M20 22 Q14 18 15 13 Q20 15 20 22" fill="white" opacity="0.9"/>
          <path d="M20 19 Q26 15 25 10 Q20 13 20 19" fill="white"/>
          <path d="M13 31 Q20 29 27 31" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
        </svg>
        <span class="brand-name">Merintis</span>
      </a>
      <!-- Versi skema — ditampilkan kecil di pojok -->
      <span class="schema-version" id="schemaVersionBadge" aria-label="Versi skema data">v3</span>
      <button class="sidebar-close-btn" id="sidebarCloseBtn" aria-label="Tutup menu navigasi">
        <i data-lucide="x" aria-hidden="true"></i>
      </button>
    </div>

    <!-- Navigasi utama — item disembunyikan/ditampilkan sesuai peran via JS -->
    <nav class="sidebar-nav" aria-label="Halaman utama">
      <ul class="nav-list" role="list">
        <!-- Tampil untuk semua peran -->
        <li class="nav-item">
          <a href="#/beranda" class="nav-link" data-page="beranda">
            <span class="nav-icon"><i data-lucide="home" aria-hidden="true"></i></span>
            <span class="nav-label">Beranda</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="#/daftar" class="nav-link" data-page="daftar">
            <span class="nav-icon"><i data-lucide="user-plus" aria-hidden="true"></i></span>
            <span class="nav-label">Pendaftaran</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="#/cari-buddy" class="nav-link" data-page="cari-buddy">
            <span class="nav-icon"><i data-lucide="search" aria-hidden="true"></i></span>
            <span class="nav-label">Cari Buddy</span>
          </a>
        </li>
        <!-- Hanya newcomer -->
        <li class="nav-item nav-divider-before nav-role-newcomer">
          <a href="#/dashboard-newcomer" class="nav-link" data-page="dashboard-newcomer">
            <span class="nav-icon"><i data-lucide="layout-dashboard" aria-hidden="true"></i></span>
            <span class="nav-label">Dashboard Newcomer</span>
          </a>
        </li>
        <!-- Hanya buddy -->
        <li class="nav-item nav-divider-before nav-role-buddy">
          <a href="#/dashboard-buddy" class="nav-link" data-page="dashboard-buddy">
            <span class="nav-icon"><i data-lucide="users" aria-hidden="true"></i></span>
            <span class="nav-label">Dashboard Buddy</span>
          </a>
        </li>
        <!-- Tampil untuk semua peran -->
        <li class="nav-item nav-divider-before">
          <a href="#/faq" class="nav-link" data-page="faq">
            <span class="nav-icon"><i data-lucide="help-circle" aria-hidden="true"></i></span>
            <span class="nav-label">FAQ</span>
          </a>
        </li>
      </ul>
    </nav>

    <!-- Footer sidebar: profil + kontrol -->
    <div class="sidebar-footer">
      <!-- Kartu profil aktif -->
      <div class="profile-card" id="profileCard" aria-label="Profil pengguna aktif">
        <div class="profile-avatar" id="profileAvatar" aria-hidden="true">--</div>
        <div class="profile-info">
          <p class="profile-name" id="profileName">Memuat…</p>
          <p class="profile-role" id="profileRole">—</p>
        </div>
      </div>

      <!-- Ganti peran (simulasi login switch) -->
      <button class="role-switcher-btn" id="roleSwitcherBtn" aria-label="Ganti peran aktif">
        <i data-lucide="repeat-2" aria-hidden="true"></i>
        <span id="roleSwitcherLabel">Ganti ke Buddy</span>
      </button>

      <!-- Aksi baris bawah -->
      <div class="sidebar-actions">
        <button class="icon-action-btn" id="darkModeBtn"
          aria-label="Aktifkan mode gelap" aria-pressed="false">
          <i data-lucide="moon" aria-hidden="true"></i>
          <span class="nav-label">Mode Gelap</span>
        </button>
        <button class="icon-action-btn collapse-btn" id="sidebarCollapseBtn"
          aria-label="Lipat sidebar" aria-expanded="true">
          <i data-lucide="panel-left-close" aria-hidden="true"></i>
          <span class="nav-label">Lipat</span>
        </button>
      </div>

      <!-- Tombol reset data demo -->
      <button class="reset-demo-btn" id="resetDemoBtn"
        aria-label="Reset semua data ke data demo awal">
        <i data-lucide="rotate-ccw" aria-hidden="true"></i>
        <span class="nav-label">Reset Data Demo</span>
      </button>
    </div>
  </aside>

  <!-- ══════════════════════════════════════
       AREA UTAMA
  ══════════════════════════════════════ -->
  <div class="main-wrapper" id="mainWrapper">

    <!-- Top bar (mobile) -->
    <header class="topbar" role="banner">
      <button class="hamburger-btn" id="hamburgerBtn"
        aria-label="Buka menu navigasi" aria-controls="sidebar" aria-expanded="false">
        <i data-lucide="menu" aria-hidden="true"></i>
      </button>
      <span class="topbar-title" id="topbarTitle">Beranda</span>
      <div class="topbar-actions">
        <button class="icon-action-btn topbar-dark-btn" id="darkModeBtnMobile"
          aria-label="Toggle mode gelap" aria-pressed="false">
          <i data-lucide="moon" aria-hidden="true"></i>
        </button>
      </div>
    </header>

    <!-- Satu landmark <main> — TANPA aria-live (dikelola via toast & focus) -->
    <main id="app-content" class="app-content" tabindex="-1">
      <div class="page-loading" aria-busy="true" aria-label="Memuat halaman…">
        <div class="loading-spinner"></div>
      </div>
    </main>

  </div><!-- /main-wrapper -->

  <!-- Toast — di luar main, punya aria-live sendiri -->
  <div class="toast-container" id="toastContainer"
    role="region" aria-label="Notifikasi" aria-live="polite" aria-atomic="false"></div>

  <!-- Modal konfirmasi -->
  <div class="modal-overlay" id="confirmModal"
    role="dialog" aria-modal="true" aria-labelledby="confirmModalTitle" hidden>
    <div class="modal-box">
      <h3 id="confirmModalTitle" class="modal-title">Konfirmasi</h3>
      <p id="confirmModalMsg" class="modal-msg"></p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="confirmCancelBtn">Batal</button>
        <button class="btn btn-danger" id="confirmOkBtn">Ya, Lanjutkan</button>
      </div>
    </div>
  </div>

  <!-- Modal edit profil buddy -->
  <div class="modal-overlay" id="editProfileModal"
    role="dialog" aria-modal="true" aria-labelledby="editProfileModalTitle" hidden>
    <div class="modal-box" style="max-width:520px">
      <h3 id="editProfileModalTitle" class="modal-title">Edit Profil</h3>
      <div id="editProfileModalBody"></div>
    </div>
  </div>

  <!-- ══════════════════════════════════════
       SPROUT — Asisten adaptasi newcomer
       Tidak ada API key di front-end.
       Panel dioperasikan keyboard; Escape menutup.
  ══════════════════════════════════════ -->

  <!-- FAB: tombol buka chat -->
  <button
    class="sprout-fab"
    id="sproutFab"
    aria-label="Buka asisten Sprout"
    aria-expanded="false"
    aria-controls="sproutPanel"
  >
    <!-- Avatar tunas SVG -->
    <svg class="sprout-fab-icon" viewBox="0 0 40 40" fill="none"
      xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
      <circle cx="20" cy="20" r="20" fill="#1a6b3c"/>
      <!-- wajah tersenyum -->
      <circle cx="15" cy="18" r="1.6" fill="white"/>
      <circle cx="25" cy="18" r="1.6" fill="white"/>
      <path d="M14 23 Q20 28 26 23" stroke="white" stroke-width="1.8"
        stroke-linecap="round" fill="none"/>
      <!-- tunas di kepala -->
      <path d="M20 10 L20 5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M20 7 Q16 4 17 1 Q20 2 20 7"  fill="white" opacity=".9"/>
      <path d="M20 6 Q24 3 23 0 Q20 1 20 6"  fill="white"/>
    </svg>
    <!-- Badge notifikasi pesan baru -->
    <span class="sprout-badge" id="sproutBadge" hidden aria-hidden="true"></span>
  </button>

  <!-- Panel percakapan -->
  <section
    class="sprout-panel"
    id="sproutPanel"
    role="dialog"
    aria-modal="false"
    aria-labelledby="sproutPanelTitle"
    aria-describedby="sproutPanelDesc"
    hidden
  >
    <!-- Header panel -->
    <header class="sprout-header">
      <div class="sprout-header-identity">
        <div class="sprout-avatar-sm" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="16" cy="16" r="16" fill="#1a6b3c"/>
            <circle cx="12" cy="14" r="1.3" fill="white"/>
            <circle cx="20" cy="14" r="1.3" fill="white"/>
            <path d="M11 19 Q16 23 21 19" stroke="white" stroke-width="1.5"
              stroke-linecap="round" fill="none"/>
            <path d="M16 7 L16 3"  stroke="white" stroke-width="1.2" stroke-linecap="round"/>
            <path d="M16 5 Q13 2 14 0 Q16 1 16 5"  fill="white" opacity=".9"/>
            <path d="M16 4 Q19 1 18 -1 Q16 0 16 4" fill="white"/>
          </svg>
        </div>
        <div>
          <h2 class="sprout-title" id="sproutPanelTitle">Sprout</h2>
          <p class="sprout-subtitle" id="sproutPanelDesc">Asisten adaptasi Merintis</p>
        </div>
      </div>
      <div class="sprout-header-actions">
        <button class="sprout-icon-btn" id="sproutClearBtn"
          aria-label="Hapus riwayat percakapan" title="Hapus riwayat">
          <i data-lucide="trash-2" aria-hidden="true"></i>
        </button>
        <button class="sprout-icon-btn" id="sproutCloseBtn"
          aria-label="Tutup panel Sprout">
          <i data-lucide="x" aria-hidden="true"></i>
        </button>
      </div>
    </header>

    <!-- Area pesan — aria-live polite agar pembaca layar mengumumkan pesan baru -->
    <div
      class="sprout-messages"
      id="sproutMessages"
      role="log"
      aria-live="polite"
      aria-atomic="false"
      aria-label="Percakapan dengan Sprout"
      tabindex="0"
    ></div>

    <!-- Indikator mengetik -->
    <div class="sprout-typing" id="sproutTyping" aria-hidden="true" hidden>
      <div class="sprout-avatar-xs" aria-hidden="true">🌱</div>
      <div class="sprout-typing-dots" role="status" aria-label="Sprout sedang mengetik…">
        <span></span><span></span><span></span>
      </div>
    </div>

    <!-- Chip saran cepat -->
    <div class="sprout-chips" id="sproutChips"
      role="group" aria-label="Saran pertanyaan cepat">
      <!-- Diisi oleh JS -->
    </div>

    <!-- Form input -->
    <form class="sprout-input-row" id="sproutForm"
      aria-label="Tulis pesan untuk Sprout" novalidate>
      <label class="sr-only" for="sproutInput">Tulis pesan</label>
      <textarea
        id="sproutInput"
        class="sprout-input"
        rows="1"
        placeholder="Tanya sesuatu ke Sprout…"
        aria-label="Tulis pesan untuk Sprout"
        autocomplete="off"
        maxlength="500"
      ></textarea>
      <button type="submit" class="sprout-send-btn"
        aria-label="Kirim pesan">
        <i data-lucide="send" aria-hidden="true"></i>
      </button>
    </form>
  </section>

  <script src="js/script.js"></script>
</body>
</html>
